<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        a.botao1 {
            background-color: darkgreen;
            color: white;
            padding: 10px;
            text-decoration: none;
            border: 1px solid greenyellow;
            border-radius: 5px;
        }

        a.botao1:hover {
            background-color: rgb(31, 151, 31);
            color: white;
            padding: 10px;
            text-decoration: none;
            border: 1px solid rgb(54, 88, 4);
            border-radius: 5px;
        }

        a.botao2 {
            text-decoration: none;
            padding: 10px;
            border: 3px double blue;
            color: blue;
        }

        a.botao2:hover {
            text-decoration: underline;
            padding: 8px;
            background-color: blueviolet;
            border: 3px double blue;
            color: blue;
        }
    </style>
</head>

<body>
    <h1>Outra pagina</h1>
    <a class="botao1" href="">SITE</a>
    <a class="botao2">SITE</a>
    <a class="botao3" href="">SITE</a>
</body>

</html>
